MOD_WTJSHOPPINGCART_FIELD_BOOTSTRAP5_OFFCANVAS_TARGET_ID_HEADER_DESC="<p>Создайте два экземпляра модуля: панель и кнопку. Используйте пару <strong>bootstrap5-offcanvas</strong> и <strong>bootstrap5-icon-btn</strong> или пару <strong>uikit-offcanvas</strong> и <strong>uikit-icon-btn</strong>. В настройках кнопки выберите ID модуля панели.</p><p>Панель рекомендуется публиковать в позиции <code>debug</code> или аналогичной рядом с <code>body</code>. Макеты UIkit используют CSS/JS шаблона, как в YOOtheme. При выборе uikit-offcanvas обычный макет строки автоматически использует UIkit; собственный макет товара можно выбрать отдельно.</p>"
