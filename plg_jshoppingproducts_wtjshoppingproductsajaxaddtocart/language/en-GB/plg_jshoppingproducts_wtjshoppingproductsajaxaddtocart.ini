PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART="Jshoppingproducts - WT JShopping AJAX Add to Cart"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_DESC="Prepares AJAX purchase buttons for JoomShopping 5. Plugin settings apply to every WT JShopping Cart module instance."
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_BTN_CSS_CLASS_FOR_PRODUCT_ADDED="CSS classes for a product in the cart"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_BTN_TEXT_FOR_PRODUCT_ADDED="Button text for a product in the cart"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_BTN_TEXT_FOR_PRODUCT_ADDED_DESC="Enter text or a site language constant. The product quantity is shown after the text."
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_BTN_TEXT_IN_CART="In cart"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_ADD_TO_CART_HELP_LABEL="AJAX add to cart setup"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELDSET_AJAX_ADD_TO_CART_LABEL="Ajax-cart"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_LIST_BUTTON_SELECTOR_LABEL="Product list buy button selector"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_LIST_BUTTON_SELECTOR_DESC="CSS selector for a button with product and category IDs or a JoomShopping purchase link. Full DOM paths such as #catalogue .product > .actions > button.buy and comma-separated selector lists are supported."
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_PRODUCT_BUTTON_SELECTOR_LABEL="Product page buy button selector"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_PRODUCT_BUTTON_SELECTOR_DESC="CSS selector for the product form submit button. Nested paths such as #comjshop .productfull form > .actions > button.buy are supported."
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_LIST_QUANTITY_SELECTOR_LABEL="Product list quantity selector"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_LIST_QUANTITY_SELECTOR_DESC="CSS selector for the quantity field, including a full DOM path. The field is read only from the clicked product."
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_PRODUCT_QUANTITY_SELECTOR_LABEL="Product page quantity selector"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_PRODUCT_QUANTITY_SELECTOR_DESC="CSS selector for the quantity field, including a full DOM path. The field is read within the submitted product form."
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_ADD_TO_CART_HELP_DESC="<p>Install the package and enable <strong>Jshoppingproducts - WT JShopping AJAX Add to Cart</strong> in Joomla's Plugins manager. Publish the cart module on the shop pages to receive cart updates.</p><p>The selector fields accept CSS selectors such as <code>[site-buy]</code> and <code>[site-qty]</code>. The examples below use the WT attributes. You can mark an optional quantity field nearby in the same product or link its ID through <code>wt-jshopping-add-to-cart-btn=&quot;qty-123&quot;</code>.</p><p>For custom notices, create site language overrides for <code>WT_JSHOP_ADD_TO_CART_SUCCESS</code> and <code>WT_JSHOP_ADD_TO_CART_ERROR</code>. Expose them for JavaScript in the active Joomla template.</p><pre><code>&lt;?php&#10;\Joomla\CMS\Language\Text::script('WT_JSHOP_ADD_TO_CART_SUCCESS');&#10;\Joomla\CMS\Language\Text::script('WT_JSHOP_ADD_TO_CART_ERROR');</code></pre><p>These plugin settings apply to all cart module instances. Move any custom selectors from the old module settings here once.</p>"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_LIST_TEMPLATE_HELP_LABEL="Product list template example"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_LIST_TEMPLATE_HELP_DESC="<p>Set the flag once in the opening PHP block of <code>components/com_jshopping/templates/&lt;template&gt;/category/products.php</code>, before it includes the list. On pages rendered by <code>products/products.php</code>, set it at the top of that file.</p><pre><code>$wtAjaxCartEnabled = \Joomla\CMS\Plugin\PluginHelper::isEnabled(&#10;    'jshoppingproducts',&#10;    'wtjshoppingproductsajaxaddtocart'&#10;);</code></pre><p>The flag is available in the parent template and in <code>list_products/product.php</code> through <code>include</code>. For related products, the flag set in <code>product/product_default.php</code> reaches the same item template through <code>product/related.php</code>.</p><p>Replace the purchase control inside the product item using the example below. The plugin supplies the text, class and quantity. The original purchase link is the fallback.</p><pre><code>&lt;?php&#10;$ajaxAvailable = ($wtAjaxCartEnabled ?? false) &amp;&amp; isset($product-&gt;wtAjaxCartInCart);&#10;$inCart = $ajaxAvailable &amp;&amp; !empty($product-&gt;wtAjaxCartInCart);&#10;$buttonText = $inCart&#10;    ? $product-&gt;wtAjaxCartButtonText . ' ' . $product-&gt;wtAjaxCartQuantity&#10;    : \Joomla\CMS\Language\Text::_('JSHOP_BUY');&#10;$buttonClass = $inCart ? ' ' . $product-&gt;wtAjaxCartButtonClass : '';&#10;?&gt;&#10;&lt;?php if ($product-&gt;buy_link) : ?&gt;&#10;    &lt;?php if ($ajaxAvailable) : ?&gt;&#10;        &lt;button type=&quot;button&quot;&#10;            class=&quot;btn btn-primary&lt;?php echo htmlspecialchars($buttonClass, ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;            wt-jshopping-add-to-cart-btn&#10;            data-wt-jshopping-add-to-cart-text=&quot;&lt;?php echo htmlspecialchars(\Joomla\CMS\Language\Text::_('JSHOP_BUY'), ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;            data-product-id=&quot;&lt;?php echo (int) $product-&gt;product_id; ?&gt;&quot;&#10;            data-product-category-id=&quot;&lt;?php echo (int) ($product-&gt;category_id ?? 0); ?&gt;&quot;&gt;&#10;            &lt;span wt-jshopping-add-to-cart-label&gt;&lt;?php echo htmlspecialchars($buttonText, ENT_QUOTES, 'UTF-8'); ?&gt;&lt;/span&gt;&#10;        &lt;/button&gt;&#10;    &lt;?php else : ?&gt;&#10;        &lt;a class=&quot;btn btn-primary button_buy&quot;&#10;            href=&quot;&lt;?php echo htmlspecialchars($product-&gt;buy_link, ENT_QUOTES, 'UTF-8', false); ?&gt;&quot;&gt;&#10;            &lt;?php echo \Joomla\CMS\Language\Text::_('JSHOP_BUY'); ?&gt;&#10;        &lt;/a&gt;&#10;    &lt;?php endif; ?&gt;&#10;&lt;?php endif; ?&gt;</code></pre>"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_PRODUCT_TEMPLATE_HELP_LABEL="Product page template example"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_PRODUCT_TEMPLATE_HELP_DESC="<p>In <code>components/com_jshopping/templates/&lt;template&gt;/product/product_default.php</code>, use the example below inside the existing product form. If you also use AJAX buttons for related products, move the <code>$wtAjaxCartEnabled</code> assignment to the opening PHP block so the included templates can use the same flag.</p><p>Use these two controls inside the existing product form. Keep the action, hidden fields, attribute inputs and wishlist button. Use the same quantity input ID so that JoomShopping can update the price.</p><pre><code>&lt;?php&#10;$wtAjaxCartEnabled = \Joomla\CMS\Plugin\PluginHelper::isEnabled(&#10;    'jshoppingproducts',&#10;    'wtjshoppingproductsajaxaddtocart'&#10;);&#10;$product = $this-&gt;product;&#10;$ajaxAvailable = $wtAjaxCartEnabled &amp;&amp; isset($product-&gt;wtAjaxCartInCart);&#10;$inCart = $ajaxAvailable &amp;&amp; !empty($product-&gt;wtAjaxCartInCart);&#10;$buttonText = $inCart&#10;    ? $product-&gt;wtAjaxCartButtonText . ' ' . $product-&gt;wtAjaxCartQuantity&#10;    : \Joomla\CMS\Language\Text::_('JSHOP_ADD_TO_CART');&#10;$buttonClass = $inCart ? ' ' . $product-&gt;wtAjaxCartButtonClass : '';&#10;?&gt;&#10;&lt;input type=&quot;&lt;?php echo htmlspecialchars($this-&gt;prod_qty_input_type, ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;    name=&quot;quantity&quot; id=&quot;quantity&quot; min=&quot;0&quot;&#10;    value=&quot;&lt;?php echo htmlspecialchars((string) $this-&gt;default_count_product, ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;    aria-label=&quot;&lt;?php echo htmlspecialchars(\Joomla\CMS\Language\Text::_('JSHOP_QUANTITY'), ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;    oninput=&quot;jshop.reloadPrices();&quot;&lt;?php echo $ajaxAvailable ? ' wt-jshopping-add-to-cart-qty' : ''; ?&gt;&gt;&#10;&lt;?php echo $this-&gt;_tmp_qty_unit; ?&gt;&#10;&lt;button type=&quot;submit&quot;&#10;    class=&quot;btn btn-primary btn-buy&lt;?php echo htmlspecialchars($buttonClass, ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;    data-wt-jshopping-add-to-cart-text=&quot;&lt;?php echo htmlspecialchars(\Joomla\CMS\Language\Text::_('JSHOP_ADD_TO_CART'), ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;    onclick=&quot;this.form.elements.to.value = 'cart';&quot;&lt;?php echo $ajaxAvailable ? ' wt-jshopping-add-to-cart-btn' : ''; ?&gt;&gt;&#10;    &lt;span&lt;?php echo $ajaxAvailable ? ' wt-jshopping-add-to-cart-label' : ''; ?&gt;&gt;&lt;?php echo htmlspecialchars($buttonText, ENT_QUOTES, 'UTF-8'); ?&gt;&lt;/span&gt;&#10;&lt;/button&gt;</code></pre>"
