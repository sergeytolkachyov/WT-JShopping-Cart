PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART="Jshoppingproducts - WT JShopping AJAX-добавление в корзину"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_DESC="Подготавливает кнопки AJAX-покупки для JoomShopping 5. Настройки плагина общие для всех экземпляров WT JShopping Cart."
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_BTN_CSS_CLASS_FOR_PRODUCT_ADDED="CSS-классы кнопки товара в корзине"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_BTN_TEXT_FOR_PRODUCT_ADDED="Текст кнопки товара в корзине"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_BTN_TEXT_FOR_PRODUCT_ADDED_DESC="Укажите текст или языковую константу сайта. После текста выводится количество товара."
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_BTN_TEXT_IN_CART="В корзине"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_ADD_TO_CART_HELP_LABEL="Как подключить AJAX-добавление в корзину"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELDSET_AJAX_ADD_TO_CART_LABEL="AJAX-корзина"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_LIST_BUTTON_SELECTOR_LABEL="Селектор кнопки «Купить» в списке товаров"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_LIST_BUTTON_SELECTOR_DESC="CSS-селектор кнопки с ID товара и категории или ссылки покупки JoomShopping. Поддерживаются полные DOM-пути, например #catalogue .product > .actions > button.buy, и списки селекторов через запятую."
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_PRODUCT_BUTTON_SELECTOR_LABEL="Селектор кнопки «Купить» в карточке товара"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_PRODUCT_BUTTON_SELECTOR_DESC="CSS-селектор кнопки отправки формы товара. Поддерживается вложенность, например #comjshop .productfull form > .actions > button.buy."
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_LIST_QUANTITY_SELECTOR_LABEL="Селектор поля «Количество» в списке товаров"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_LIST_QUANTITY_SELECTOR_DESC="CSS-селектор поля количества, включая полный DOM-путь. Поле ищется только в том же товаре, что и нажатая кнопка."
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_PRODUCT_QUANTITY_SELECTOR_LABEL="Селектор поля «Количество» в карточке товара"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_PRODUCT_QUANTITY_SELECTOR_DESC="CSS-селектор поля количества, включая полный DOM-путь. Поле ищется внутри отправленной формы товара."
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_ADD_TO_CART_HELP_DESC="<p>Установите пакет и включите <strong>Jshoppingproducts - WT JShopping AJAX-добавление в корзину</strong> в менеджере плагинов Joomla. Опубликуйте модуль на страницах магазина, чтобы он получал обновления корзины.</p><p>В поля селекторов можно вписать CSS-селекторы вида <code>[site-buy]</code> и <code>[site-qty]</code>. В примерах ниже используются атрибуты WT. Опциональное поле количества разместите внутри того же товара или свяжите его ID через <code>wt-jshopping-add-to-cart-btn=&quot;qty-123&quot;</code>.</p><p>Для своих уведомлений добавьте переопределения языка сайта <code>WT_JSHOP_ADD_TO_CART_SUCCESS</code> и <code>WT_JSHOP_ADD_TO_CART_ERROR</code>. Опубликуйте их для JavaScript в активном шаблоне Joomla.</p><pre><code>&lt;?php&#10;\Joomla\CMS\Language\Text::script('WT_JSHOP_ADD_TO_CART_SUCCESS');&#10;\Joomla\CMS\Language\Text::script('WT_JSHOP_ADD_TO_CART_ERROR');</code></pre><p>Эти настройки плагина применяются ко всем экземплярам корзины. Нестандартные селекторы из старых настроек модуля перенесите сюда один раз.</p>"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_LIST_TEMPLATE_HELP_LABEL="Пример кнопки в списке товаров"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_LIST_TEMPLATE_HELP_DESC="<p>Вычислите флаг один раз в начальном PHP-блоке <code>components/com_jshopping/templates/&lt;шаблон&gt;/category/products.php</code>, до подключения списка. На страницах с макетом <code>products/products.php</code> добавьте этот код в его начало.</p><pre><code>$wtAjaxCartEnabled = \Joomla\CMS\Plugin\PluginHelper::isEnabled(&#10;    'jshoppingproducts',&#10;    'wtjshoppingproductsajaxaddtocart'&#10;);</code></pre><p>Флаг доступен в родительском макете и в <code>list_products/product.php</code> благодаря <code>include</code>. Для сопутствующих товаров тот же макет получает флаг из <code>product/product_default.php</code> через <code>product/related.php</code>.</p><p>Замените элемент покупки внутри товара по примеру ниже. Плагин передаёт текст, класс кнопки и количество. Штатная ссылка покупки остаётся запасным вариантом.</p><pre><code>&lt;?php&#10;$ajaxAvailable = ($wtAjaxCartEnabled ?? false) &amp;&amp; isset($product-&gt;wtAjaxCartInCart);&#10;$inCart = $ajaxAvailable &amp;&amp; !empty($product-&gt;wtAjaxCartInCart);&#10;$buttonText = $inCart&#10;    ? $product-&gt;wtAjaxCartButtonText . ' ' . $product-&gt;wtAjaxCartQuantity&#10;    : \Joomla\CMS\Language\Text::_('JSHOP_BUY');&#10;$buttonClass = $inCart ? ' ' . $product-&gt;wtAjaxCartButtonClass : '';&#10;?&gt;&#10;&lt;?php if ($product-&gt;buy_link) : ?&gt;&#10;    &lt;?php if ($ajaxAvailable) : ?&gt;&#10;        &lt;button type=&quot;button&quot;&#10;            class=&quot;btn btn-primary&lt;?php echo htmlspecialchars($buttonClass, ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;            wt-jshopping-add-to-cart-btn&#10;            data-wt-jshopping-add-to-cart-text=&quot;&lt;?php echo htmlspecialchars(\Joomla\CMS\Language\Text::_('JSHOP_BUY'), ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;            data-product-id=&quot;&lt;?php echo (int) $product-&gt;product_id; ?&gt;&quot;&#10;            data-product-category-id=&quot;&lt;?php echo (int) ($product-&gt;category_id ?? 0); ?&gt;&quot;&gt;&#10;            &lt;span wt-jshopping-add-to-cart-label&gt;&lt;?php echo htmlspecialchars($buttonText, ENT_QUOTES, 'UTF-8'); ?&gt;&lt;/span&gt;&#10;        &lt;/button&gt;&#10;    &lt;?php else : ?&gt;&#10;        &lt;a class=&quot;btn btn-primary button_buy&quot;&#10;            href=&quot;&lt;?php echo htmlspecialchars($product-&gt;buy_link, ENT_QUOTES, 'UTF-8', false); ?&gt;&quot;&gt;&#10;            &lt;?php echo \Joomla\CMS\Language\Text::_('JSHOP_BUY'); ?&gt;&#10;        &lt;/a&gt;&#10;    &lt;?php endif; ?&gt;&#10;&lt;?php endif; ?&gt;</code></pre>"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_PRODUCT_TEMPLATE_HELP_LABEL="Пример кнопки в карточке товара"
PLG_JSHOPPINGPRODUCTS_WTJSHOPPINGPRODUCTSAJAXADDTOCART_FIELD_AJAX_PRODUCT_TEMPLATE_HELP_DESC="<p>В <code>components/com_jshopping/templates/&lt;шаблон&gt;/product/product_default.php</code> используйте пример ниже в существующей форме товара. Если AJAX-кнопки нужны и для сопутствующих товаров, перенесите объявление <code>$wtAjaxCartEnabled</code> в начальный PHP-блок файла. Тогда подключаемые макеты смогут использовать тот же флаг.</p><p>Разместите эти элементы внутри существующей формы товара. Сохраните её адрес, скрытые поля, поля атрибутов и кнопку избранного. ID поля количества нужен JoomShopping для обновления цены.</p><pre><code>&lt;?php&#10;$wtAjaxCartEnabled = \Joomla\CMS\Plugin\PluginHelper::isEnabled(&#10;    'jshoppingproducts',&#10;    'wtjshoppingproductsajaxaddtocart'&#10;);&#10;$product = $this-&gt;product;&#10;$ajaxAvailable = $wtAjaxCartEnabled &amp;&amp; isset($product-&gt;wtAjaxCartInCart);&#10;$inCart = $ajaxAvailable &amp;&amp; !empty($product-&gt;wtAjaxCartInCart);&#10;$buttonText = $inCart&#10;    ? $product-&gt;wtAjaxCartButtonText . ' ' . $product-&gt;wtAjaxCartQuantity&#10;    : \Joomla\CMS\Language\Text::_('JSHOP_ADD_TO_CART');&#10;$buttonClass = $inCart ? ' ' . $product-&gt;wtAjaxCartButtonClass : '';&#10;?&gt;&#10;&lt;input type=&quot;&lt;?php echo htmlspecialchars($this-&gt;prod_qty_input_type, ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;    name=&quot;quantity&quot; id=&quot;quantity&quot; min=&quot;0&quot;&#10;    value=&quot;&lt;?php echo htmlspecialchars((string) $this-&gt;default_count_product, ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;    aria-label=&quot;&lt;?php echo htmlspecialchars(\Joomla\CMS\Language\Text::_('JSHOP_QUANTITY'), ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;    oninput=&quot;jshop.reloadPrices();&quot;&lt;?php echo $ajaxAvailable ? ' wt-jshopping-add-to-cart-qty' : ''; ?&gt;&gt;&#10;&lt;?php echo $this-&gt;_tmp_qty_unit; ?&gt;&#10;&lt;button type=&quot;submit&quot;&#10;    class=&quot;btn btn-primary btn-buy&lt;?php echo htmlspecialchars($buttonClass, ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;    data-wt-jshopping-add-to-cart-text=&quot;&lt;?php echo htmlspecialchars(\Joomla\CMS\Language\Text::_('JSHOP_ADD_TO_CART'), ENT_QUOTES, 'UTF-8'); ?&gt;&quot;&#10;    onclick=&quot;this.form.elements.to.value = 'cart';&quot;&lt;?php echo $ajaxAvailable ? ' wt-jshopping-add-to-cart-btn' : ''; ?&gt;&gt;&#10;    &lt;span&lt;?php echo $ajaxAvailable ? ' wt-jshopping-add-to-cart-label' : ''; ?&gt;&gt;&lt;?php echo htmlspecialchars($buttonText, ENT_QUOTES, 'UTF-8'); ?&gt;&lt;/span&gt;&#10;&lt;/button&gt;</code></pre>"
