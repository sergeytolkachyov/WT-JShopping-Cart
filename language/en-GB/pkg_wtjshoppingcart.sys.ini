PKG_WTJSHOPPINGCART_MAYBE_INTERESTING="<h4>You may also find this interesting</h4><ul class=\"nav nav-tabs nav-stacked list-group\"><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/web-assets\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla 4 - Joomla 6 Web Assets</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomshopping\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Extensions for JoomShopping</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-plugins\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla plugins</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-modules\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla modules</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/components\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla components</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/biblioteki\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla libraries for developers</a></li></ul>"
PKG_WTJSHOPPINGCART_WHATS_NEW="<h3>v.1.2.0 What's new?</h3><ul><li>The package installs the cart module and the AJAX add-to-cart plugin for JoomShopping 5.</li><li>After installation, open the <a href=\"index.php?option=com_plugins&amp;view=plugins&amp;filter[element]=wtjshoppingproductsajaxaddtocart\">Joomla plugin list</a> and enable the <strong>WT JShopping AJAX Add to Cart</strong> plugin.</li><li>In the plugin settings, open the <strong>Ajax-cart</strong> tab to set the CSS selectors for buy buttons and quantity fields. This tab also includes PHP code examples for the product list and product page templates.</li><li>Purchase buttons can show the quantity already in the cart. Cart updates preserve decimal quantities and prices.</li></ul>"
