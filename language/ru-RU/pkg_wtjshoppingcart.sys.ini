PKG_WTJSHOPPINGCART_MAYBE_INTERESTING="<h4>Может быть интересно</h4><ul class=\"nav nav-tabs nav-stacked list-group\"><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/web-assets\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Joomla 4 - Joomla 6 Web Assets</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomshopping\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Расширения для JoomShopping</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-plugins\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Плагины Joomla</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-modules\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Модули Joomla</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/components\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Компоненты Joomla</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/biblioteki\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Библиотеки Joomla для разработчиков</a></li></ul>"
PKG_WTJSHOPPINGCART_WHATS_NEW="<h3>v.1.2.0 Что нового?</h3><ul><li>Пакет устанавливает модуль корзины и AJAX-плагин для JoomShopping 5.</li><li>После установки откройте <a href=\"index.php?option=com_plugins&amp;view=plugins&amp;filter[element]=wtjshoppingproductsajaxaddtocart\">список плагинов Joomla</a> и включите плагин <strong>WT JShopping AJAX-добавление в корзину</strong>.</li><li>На вкладке <strong>«AJAX-корзина»</strong> в настройках плагина можно задать CSS-селекторы кнопок покупки и полей количества. Там же приведены примеры PHP-кода для шаблонов списка товаров и карточки товара.</li><li>Кнопки покупки могут показывать количество товара в корзине. При обновлении корзины сохраняются дробные количества и цены.</li></ul>"
